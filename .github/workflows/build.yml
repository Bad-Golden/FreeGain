name: build

# Builds the standalone downloads on every push (grab them from the run's
# "Artifacts" section), and attaches them to a GitHub Release when a tag
# like v1.0.0 is pushed.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FreeGain-Windows
          - os: macos-latest       # Apple Silicon (arm64)
            artifact: FreeGain-macOS-AppleSilicon
          - os: macos-15-intel     # Intel (x86_64)
            artifact: FreeGain-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q

      # pip on a current macOS runner picks numpy's "macOS 14+" wheels, which
      # makes an app that won't start on older Macs. Swap in numpy's
      # compatibility wheel so the app runs on macOS 11 (Big Sur) and later.
      - name: Use macOS 11-compatible numpy (macOS)
        if: runner.os == 'macOS'
        run: |
          pip download --only-binary=:all: --no-deps --python-version 3.12 \
            --platform "macosx_11_0_$(uname -m)" -d compat-wheels numpy
          pip install --force-reinstall --no-deps compat-wheels/numpy-*.whl
          python -c "import numpy; print('numpy', numpy.__version__)"

      - run: pyinstaller --noconfirm --clean packaging/freegain.spec
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Check the app runs on macOS 11+ (macOS)
        if: runner.os == 'macOS'
        run: python packaging/check_macos_min.py dist/FreeGain.app 11.0

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/FreeGain.exe, packaging/READ_ME_FIRST.txt, LICENSE release/
          Compress-Archive -Path release/* -DestinationPath FreeGain-Windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          cp -R dist/FreeGain.app release/
          cp packaging/READ_ME_FIRST.txt LICENSE release/
          file dist/FreeGain.app/Contents/MacOS/FreeGain
          (cd release && zip -qry ../${{ matrix.artifact }}.zip .)

      # Launch the app exactly as a user would get it: unzip the release zip
      # and run the app inside it, then check it's still alive after a few
      # seconds, grab a screenshot and any output. Launching from a script
      # skips Gatekeeper's "unidentified developer" prompt, so this tests the
      # app itself; the spctl line just records what Gatekeeper would say.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p smoke/unzipped
          ditto -x -k ${{ matrix.artifact }}.zip smoke/unzipped
          APP=smoke/unzipped/FreeGain.app
          echo "== architecture";  file "$APP/Contents/MacOS/FreeGain" | tee smoke/report.txt
          echo "== macOS";         sw_vers | tee -a smoke/report.txt
          echo "== codesign";      (codesign --verify --deep --strict -v "$APP" 2>&1 || true) | tee -a smoke/report.txt
          echo "== gatekeeper";    (spctl --assess --type execute -vv "$APP" 2>&1 || true) | tee -a smoke/report.txt
          "$APP/Contents/MacOS/FreeGain" > smoke/app-output.txt 2>&1 &
          PID=$!
          sleep 20
          screencapture -x smoke/screenshot.png || true
          if kill -0 $PID 2>/dev/null; then
            echo "RESULT: app still running after 20s" | tee -a smoke/report.txt
            kill $PID
          else
            CODE=0; wait $PID || CODE=$?
            echo "RESULT: app exited early with code $CODE" | tee -a smoke/report.txt
            cat smoke/app-output.txt
            exit 1
          fi
          cat smoke/app-output.txt

      - name: Upload smoke test results (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.artifact }}
          path: smoke/*.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FreeGain-Windows.zip
            FreeGain-macOS-AppleSilicon.zip
            FreeGain-macOS-Intel.zip
