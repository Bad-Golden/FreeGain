name: build

# Builds the standalone downloads on every push (grab them from the run's
# "Artifacts" section), and attaches them to a GitHub Release when a tag
# like v1.0.0 is pushed.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FreeGain-Windows
          - os: macos-latest       # Apple Silicon (arm64)
            artifact: FreeGain-macOS-AppleSilicon
          - os: macos-15-intel     # Intel (x86_64)
            artifact: FreeGain-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q

      # pip on a current macOS runner picks numpy's "macOS 14+" wheels, which
      # makes an app that won't start on older Macs. Swap in numpy's
      # compatibility wheel so the app runs on macOS 11 (Big Sur) and later.
      - name: Use macOS 11-compatible numpy (macOS)
        if: runner.os == 'macOS'
        run: |
          pip download --only-binary=:all: --no-deps --python-version 3.12 \
            --platform "macosx_11_0_$(uname -m)" -d compat-wheels numpy
          pip install --force-reinstall --no-deps compat-wheels/numpy-*.whl
          python -c "import numpy; print('numpy', numpy.__version__)"

      - run: pyinstaller --noconfirm --clean packaging/freegain.spec
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Check the app runs on macOS 11+ (macOS)
        if: runner.os == 'macOS'
        run: python packaging/check_macos_min.py dist/FreeGain.app 11.0

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/FreeGain.exe, packaging/READ_ME_FIRST.txt, LICENSE release/
          Compress-Archive -Path release/* -DestinationPath FreeGain-Windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          cp -R dist/FreeGain.app release/
          cp packaging/READ_ME_FIRST.txt LICENSE release/
          file dist/FreeGain.app/Contents/MacOS/FreeGain
          (cd release && zip -qry ../${{ matrix.artifact }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FreeGain-Windows.zip
            FreeGain-macOS-AppleSilicon.zip
            FreeGain-macOS-Intel.zip
